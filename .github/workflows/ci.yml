name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # the step caps add up to 31 minutes (install 8, e2e 10, feel 10 from task 7, baseline 3) plus
    # about 5 of npm ci, gen, unit and contrast. 20 would kill a run whose every step is inside its cap
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 24, not 26: playwright 1.58.2's browser extraction hangs forever under node 26
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: generated files are current
        run: |
          npm run gen
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: npm test
      - run: npm run check
      # every test runs headless, so the headless shell is the only browser we need
      - run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 8
      - run: npm run e2e
        timeout-minutes: 10
      - run: npm run feel
        timeout-minutes: 10
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: feel-reports
          path: test-results/**/feel-*
          if-no-files-found: ignore
      # informational: the runner's numbers on the clean control, next to every feel run (spec 8.3).
      # it gates nothing, so a crash here never turns ci red
      - run: node scripts/feel-baseline.js --runs=5 --dpr=2
        timeout-minutes: 3
        continue-on-error: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: feel-baseline
          path: test-results/feel-baseline-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: gallery-screenshots
          path: gallery/screenshots
          if-no-files-found: ignore
